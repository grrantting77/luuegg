<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>噜包蛋之城</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* Layout idea: a hand-drawn notebook town. Paper background, ink outlines, sticker-like cards with offset shadows; each district has its own color. */
:root{
  --paper:#FBF4E6; --paper-2:#F3E7CF; --card:#FFFDF8; --ink:#3F3024; --ink-2:#7A6552; --ink-3:#A8957F;
  --lu:#B9854F; --dan:#F2B632; --blush:#F2A28F;
  --cinema:#7C78C8; --cinema-soft:#E6E4F8;
  --canteen:#E2785A; --canteen-soft:#FBE3D8;
  --travel:#3F9B82; --travel-soft:#D8EFE6;
  --want:#A99C8C;
  --invest:#C98A12; --invest-soft:#FBF0D2;
  --up:#D9453B; --down:#2E9B62;
  --sea:#DCEDEA; --land:#F7EBD2; --land-line:#9C8466; --visited:#CDEBDF;
  --font-display:'ZCOOL KuaiLe','Patrick Hand','PingFang SC','Microsoft YaHei',sans-serif;
  --font-body:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --font-hand:'Patrick Hand','ZCOOL KuaiLe',cursive;
  --r:18px 22px 16px 24px / 22px 16px 24px 18px;
  --r-sm:10px 13px 9px 14px / 13px 9px 14px 10px;
  --shadow:3px 4px 0 var(--ink);
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:radial-gradient(rgba(63,48,36,.07) 1px, transparent 1.2px);
  background-size:20px 20px;
  color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
body.modal-open{overflow:hidden}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
.num{font-family:var(--font-hand);font-variant-numeric:tabular-nums;letter-spacing:.02em}
:focus-visible{outline:3px dashed var(--dan);outline-offset:3px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:2.5px solid var(--ink)}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:6px;text-decoration:none}
.brand-mascots{display:flex;align-items:flex-end}
.brand-mascots > *{margin-right:-8px}
.brand-name{font-family:var(--font-display);font-size:24px;margin-left:10px;white-space:nowrap}
.nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.nav a{text-decoration:none;padding:6px 14px;border:2px solid transparent;border-radius:var(--r-sm);font-family:var(--font-display);font-size:17px;display:flex;align-items:center;gap:6px}
.nav a:hover{border-color:var(--ink)}
.nav a[aria-current="page"]{border-color:var(--ink);box-shadow:2px 3px 0 var(--ink);background:var(--card)}
.nav a[data-d="cinema"][aria-current="page"]{background:var(--cinema-soft)}
.nav a[data-d="canteen"][aria-current="page"]{background:var(--canteen-soft)}
.nav a[data-d="travel"][aria-current="page"]{background:var(--travel-soft)}
.nav a[data-d="home"][aria-current="page"]{background:#FCEFC4}
.nav a[data-d="invest"][aria-current="page"]{background:var(--invest-soft)}
body.no-admin .admin-only{display:none !important}
.gear{border:2px solid var(--ink);background:var(--card);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none}
.gear:hover{background:#FCEFC4}
.bottom-nav{display:none}

/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.banner{max-width:1180px;margin:12px auto 0;padding:10px 16px;border:2px dashed var(--ink-2);border-radius:var(--r-sm);background:#FFF7DD;color:var(--ink);font-size:14px}
.banner[hidden]{display:none}
.wrap-banner{padding:0 20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border:2.5px solid var(--ink);border-radius:var(--r-sm);background:var(--card);cursor:pointer;font-weight:500;box-shadow:2px 3px 0 var(--ink);transition:transform .08s, box-shadow .08s;text-decoration:none;white-space:nowrap;line-height:1.3}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--dan)}
.btn.cinema{background:var(--cinema);color:#fff}
.btn.canteen{background:var(--canteen);color:#fff}
.btn.travel{background:var(--travel);color:#fff}
.btn.ghost{box-shadow:none;border-style:dashed;background:transparent}
.btn.ghost:hover{box-shadow:none;transform:none;background:var(--card)}
.btn.danger{color:#B23B2A;border-color:#B23B2A;box-shadow:2px 3px 0 #B23B2A}
.btn.small{padding:4px 10px;font-size:13px;border-width:2px;box-shadow:1.5px 2px 0 var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.edit-only{display:none !important}
body.can-edit .edit-only{display:inline-flex !important}
body.can-edit div.edit-only, body.can-edit section.edit-only{display:block !important}

.card{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 10px;border:1.8px solid var(--ink);border-radius:999px;font-size:13px;background:var(--card);white-space:nowrap}
.chip.cinema{background:var(--cinema-soft)} .chip.canteen{background:var(--canteen-soft)} .chip.travel{background:var(--travel-soft)}
.chip.want{border-style:dashed;color:var(--ink-2)}
.chip.again{background:#FDE2DC}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px}

/* section header */
.district-head{display:flex;align-items:center;gap:18px;margin:4px 0 18px;flex-wrap:wrap}
.district-head .icon{flex:none}
.district-head h1{font-size:36px}
.district-head p{margin:2px 0 0;color:var(--ink-2)}
.district-head .head-actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.tabs{display:flex;gap:0;border:2.5px solid var(--ink);border-radius:var(--r-sm);overflow:hidden;background:var(--card)}
.tabs button{border:0;background:transparent;padding:6px 14px;cursor:pointer;border-right:2px solid var(--ink);font-family:var(--font-display);font-size:16px}
.tabs button:last-child{border-right:0}
.tabs button[aria-pressed="true"]{background:var(--dan)}
.search{flex:1;min-width:160px;max-width:320px;padding:7px 12px;border:2.5px solid var(--ink);border-radius:var(--r-sm);background:var(--card)}
select.sel{padding:7px 10px;border:2.5px solid var(--ink);border-radius:var(--r-sm);background:var(--card);cursor:pointer}

.empty{padding:36px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink-2)}
.empty .pair{display:flex;gap:4px}
.empty h3{color:var(--ink);font-size:22px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;align-items:center;padding:26px 30px;margin-bottom:28px;background:var(--card);border:2.5px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero h1{font-size:44px;margin-bottom:8px}
.hero .motto{font-size:17px;color:var(--ink-2);margin:0 0 16px}
.days{display:inline-flex;align-items:baseline;gap:8px;padding:8px 18px;background:#FCEFC4;border:2.5px solid var(--ink);border-radius:var(--r-sm);font-size:16px}
.days b{font-family:var(--font-hand);font-size:34px;line-height:1;font-weight:400}
.hero-art{position:relative;display:flex;justify-content:center;align-items:flex-end;min-height:220px}
.hero-art .town{position:absolute;inset:auto 0 0 0;width:100%;height:auto}
.hero-art .duo{position:relative;display:flex;align-items:flex-end;gap:6px;margin-bottom:4%;z-index:1;max-width:62%}
.hero-art .duo > *{max-width:50%;height:auto}
.hero-art .duo > :first-child{transform:rotate(-4deg)}
.hero-art .duo > :last-child{transform:rotate(5deg)}
.bubble{position:absolute;top:6px;right:12%;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:4px 12px;font-family:var(--font-display);font-size:16px}
.bubble::after{content:"";position:absolute;left:18px;bottom:-9px;width:12px;height:12px;background:var(--card);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}

.districts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;margin-bottom:34px}
.dcard{display:flex;flex-direction:column;gap:10px;padding:18px 20px 16px;text-decoration:none;transition:transform .12s}
.dcard:hover{transform:rotate(-.6deg) translateY(-3px)}
.dcard.cinema{background:var(--cinema-soft)} .dcard.canteen{background:var(--canteen-soft)} .dcard.travel{background:var(--travel-soft)}
.soon-note{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:14px;margin:-14px 0 30px;padding:6px 14px;border:2px dashed rgba(63,48,36,.3);border-radius:var(--r-sm);width:fit-content}
.dcard-top{display:flex;align-items:center;gap:12px}
.dcard h2{font-size:26px}
.dcard .stat{font-size:15px}
.dcard .stat b{font-family:var(--font-hand);font-size:24px;font-weight:400;margin:0 2px}
.dcard .latest{font-size:14px;color:var(--ink-2);border-top:2px dashed rgba(63,48,36,.25);padding-top:8px;margin-top:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard .go{font-family:var(--font-display);font-size:15px}

.section-title{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.section-title h2{font-size:26px}
.feed{display:flex;flex-direction:column;gap:10px}
.feed-item{display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--card);border:2px solid var(--ink);border-radius:var(--r-sm);cursor:pointer;text-align:left;width:100%}
.feed-item:hover{background:#FFF8E6}
.feed-thumb{width:52px;height:52px;flex:none;border:2px solid var(--ink);border-radius:10px;overflow:hidden;display:grid;place-items:center;background:var(--paper-2)}
.feed-thumb img{width:100%;height:100%;object-fit:cover}
.feed-main{min-width:0;flex:1}
.feed-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed-sub{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed-date{font-family:var(--font-hand);color:var(--ink-2);font-size:16px;flex:none}

/* ---------- cinema ---------- */
.poster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px}
.poster-card{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.poster{aspect-ratio:2/3;border:2.5px solid var(--ink);border-radius:var(--r-sm);box-shadow:var(--shadow);overflow:hidden;position:relative;background:var(--cinema-soft);transition:transform .12s}
.poster-card:hover .poster{transform:rotate(-1.2deg) translateY(-3px)}
.poster img{width:100%;height:100%;object-fit:cover}
.poster-ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12px}
.poster-ph .pt{font-family:var(--font-display);font-size:22px;line-height:1.2;word-break:break-word}
.poster-ph .pf{display:flex;justify-content:flex-end;opacity:.8}
.poster-meta .t{font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.poster-meta .d{font-size:13px;color:var(--ink-2)}
.mini-ratings{display:flex;gap:10px;font-size:13px;align-items:center;flex-wrap:wrap}
.mini-ratings > span{display:inline-flex;align-items:center;gap:3px}
.stars svg{flex:none}
.who-dot{width:18px;height:18px;border-radius:50%;border:1.6px solid var(--ink);display:inline-grid;place-items:center;font-size:11px;font-family:var(--font-display);line-height:1}
.who-dot.lu{background:#E3C29F} .who-dot.dan{background:#FFF6DA}
.diff-badge{position:absolute;top:8px;left:8px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:0 8px;font-size:12px}

/* stars */
.stars{position:relative;display:inline-block;line-height:0;white-space:nowrap;vertical-align:middle}
.stars svg{width:var(--s,16px);height:var(--s,16px)}
.stars-bg svg path{fill:#EADFCB;stroke:var(--ink-3)}
.stars-fg{position:absolute;inset:0 auto 0 0;overflow:hidden;white-space:nowrap}
.stars-fg svg path{fill:var(--dan);stroke:var(--ink)}
.star-input{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;touch-action:manipulation}
.star-val{font-family:var(--font-hand);font-size:18px;color:var(--ink-2);min-width:3em}

/* ---------- canteen ---------- */
.meal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.meal-card{padding:0;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;transition:transform .12s}
.meal-card:hover{transform:translateY(-3px)}
.meal-photo{aspect-ratio:1/1;background:var(--canteen-soft);border-bottom:2.5px solid var(--ink);display:grid;place-items:center;overflow:hidden;position:relative}
.meal-photo img{width:100%;height:100%;object-fit:cover}
.meal-photo img{object-position:center}
.meal-photo .count{position:absolute;right:6px;top:6px;background:rgba(255,253,248,.85);border:1.5px solid var(--ink);border-radius:999px;padding:0 7px;font-size:11.5px;line-height:1.6}
.meal-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.meal-body .t{font-weight:700;font-size:16px;line-height:1.35}
.meal-body .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.price{font-family:var(--font-hand);font-size:19px}
.view-toggle{margin-left:auto}
/* invest */
.btn.invest{background:var(--invest);color:#fff}
.chip.invest{background:var(--invest-soft)}
.dcard.invest{background:var(--invest-soft)}
.pnl-red{color:var(--up)} .pnl-green{color:var(--down)}
.inv-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:18px}
.inv-tile{padding:14px 18px}
.inv-cur{font-family:var(--font-display);font-size:20px;margin-bottom:6px}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px 16px}
.inv-grid > div{display:flex;flex-direction:column}
.inv-grid b{font-weight:400;font-size:20px;line-height:1.3}
.inv-grid.big b{font-size:24px}
.inv-grid small{font-size:13px}
.inv-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.inv-card{padding:14px 18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .12s}
.inv-card:hover{transform:translateY(-3px)}
.inv-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.inv-name{font-weight:700;font-size:17px}
.inv-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:2px dashed rgba(63,48,36,.2);padding-top:8px}
.inv-nums > div{display:flex;flex-direction:column;min-width:0}
.inv-nums b{font-weight:400;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.inv-nums small{font-size:12px}
.inv-thesis{color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price-quick{display:flex !important;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:10px 12px;border:2px dashed rgba(63,48,36,.3);border-radius:var(--r-sm)}
body:not(.can-edit) .price-quick{display:none !important}
.price-quick input{padding:5px 10px;border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--card);width:150px}
.tx-table-wrap{overflow-x:auto}
.tx-table{width:100%;border-collapse:collapse;font-size:14px}
.tx-table th{text-align:left;font-size:12.5px;color:var(--ink-2);font-weight:500;border-bottom:2px solid var(--ink);padding:4px 8px}
.tx-table td{padding:6px 8px;border-bottom:1px dashed rgba(63,48,36,.25);white-space:nowrap}
.tx-table td:last-child{white-space:normal}
.tx-kind{padding:0 8px;border-radius:999px;border:1.5px solid var(--ink);font-size:12.5px}
.tx-kind.buy{background:#FDE2DC} .tx-kind.sell{background:#D8EFE6} .tx-kind.div{background:#FCEFC4}
.tx-row{display:grid;grid-template-columns:140px 110px 1fr 1fr 1fr 1fr 1.6fr 34px;gap:6px;align-items:center;margin-bottom:6px}
.tx-row input, .tx-row select{width:100%;padding:6px 8px;border:2px solid var(--ink);border-radius:10px;background:var(--card);min-width:0}
.tx-row[data-kind="buy"] .tx-amount, .tx-row[data-kind="sell"] .tx-amount{visibility:hidden}
.tx-row[data-kind="div"] .tx-qty, .tx-row[data-kind="div"] .tx-price, .tx-row[data-kind="div"] .tx-fee,
.tx-row[data-kind="fee"] .tx-qty, .tx-row[data-kind="fee"] .tx-price, .tx-row[data-kind="fee"] .tx-fee{visibility:hidden}
.tx-preview{padding:8px 10px;background:var(--paper-2);border-radius:10px}

/* ---------- travel ---------- */
.travel-stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.tstat{padding:8px 16px;background:var(--card);border:2px solid var(--ink);border-radius:var(--r-sm)}
.tstat b{font-family:var(--font-hand);font-size:28px;font-weight:400;margin-right:4px}
.trip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.trip-card{padding:0;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;transition:transform .12s}
.trip-card:hover{transform:rotate(.6deg) translateY(-3px)}
.trip-cover{aspect-ratio:16/10;background:var(--travel-soft);border-bottom:2.5px solid var(--ink);display:grid;place-items:center;overflow:hidden}
.trip-cover img{width:100%;height:100%;object-fit:cover}
.trip-body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:6px}
.trip-body h3{font-size:22px}
.trip-places{display:flex;gap:6px;flex-wrap:wrap}
.map-block{margin-bottom:24px}

/* ---------- map ---------- */
.geomap{position:relative;height:var(--map-h,380px);border:2.5px solid var(--ink);border-radius:var(--r);overflow:hidden;background:var(--sea);box-shadow:var(--shadow)}
.geomap.flat{box-shadow:none;border-width:2px}
.map-svg{display:block;width:100%;height:100%;cursor:grab;touch-action:pan-x pan-y;
  background-color:var(--sea);
  background-image:radial-gradient(circle at 10px 10px, rgba(255,255,255,.55) 1.2px, transparent 1.6px);background-size:24px 24px}
.map-svg:active{cursor:grabbing}
.map-svg.pickable{cursor:crosshair;touch-action:none}
.map-nudge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(63,48,36,.82);color:#FFFDF8;padding:8px 16px;border-radius:999px;font-size:14px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;z-index:6}
.map-nudge.on{opacity:1}
.map-svg path{vector-effect:non-scaling-stroke}
.land path.country{fill:var(--land);stroke:var(--land-line);stroke-width:.8}
.land path.country.visited{fill:var(--visited)}
.land path.country.sg{fill:#F9EDD5}
.prov path{fill:none;stroke:var(--land-line);stroke-width:.5;stroke-dasharray:2 3;opacity:0}
.prov path.visited{fill:#86CBB0;fill-opacity:.8;opacity:1;stroke-dasharray:none}
.map-svg.z-prov .prov path{opacity:.8}
.sg-pa path{fill:none;stroke:#CBB490;stroke-width:.7;stroke-dasharray:3 3;opacity:0}
.map-svg.z-lm .sg-pa path{opacity:1}
.labels text{font-family:var(--font-hand),var(--font-body);paint-order:stroke;stroke:#FFFDF8;stroke-width:3px;fill:var(--ink-2);text-anchor:middle}
.labels .lbl-lm, .labels .lbl-pa{display:none}
.map-svg.z-lm .labels .lbl-lm{display:inline}
.map-svg.z-pa .labels .lbl-pa{display:inline}
.labels .lbl-lm text{font-size:13px;fill:var(--ink)}
.labels .lbl-pa text{font-size:11px;fill:var(--ink-3);letter-spacing:.04em}
.labels .lbl-lm circle{fill:var(--ink);stroke:none}
g.pin{cursor:pointer;outline:none}
.ext-urban path{fill:rgba(190,140,80,.16);stroke:rgba(190,140,80,.35);stroke-width:.5}
.map-svg.z-city .land path.country.visited{fill:var(--land)}
.map-svg.z-city .prov path.visited{fill-opacity:.28}
.map-svg.z-st .labels .lbl-lm{display:none}
.ext-lakes path{fill:var(--sea);stroke:#9CC3C4;stroke-width:.6}
.ext-rivers path{fill:none;stroke:#8EC1CF;stroke-width:1}
.ext-roads path{fill:none;stroke:#D9A877;stroke-width:.8}
.ext-roads path.major{stroke:#C98B55;stroke-width:1.4}
.map-svg:not(.z-riv) .ext-rivers, .map-svg:not(.z-riv) .ext-lakes, .map-svg:not(.z-city) .ext-urban, .map-svg:not(.z-city) .ext-roads{display:none}
.rail path{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.map-svg.z-lm .rail path{opacity:.85}
.labels .lbl-st{display:none}
.map-svg.z-lm .labels .lbl-st{display:inline}
.labels .lbl-st circle{fill:#FFFDF8;stroke:var(--ink);stroke-width:1.3}
.labels .lbl-st text{font-size:10.5px;fill:var(--ink-2);display:none}
.map-svg.z-st .labels .lbl-st text{display:inline}
.map-svg.z-st .labels .lbl-pa{display:none}
.routes path{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-dasharray:5 5;opacity:.65}
.routes path.want{stroke:var(--ink-3);opacity:.6}
.pin-photo .ph-ring{fill:#FFFDF8;stroke:var(--ink);stroke-width:2.2}
.pin-photo .ph-tail{fill:var(--ink)}
.pin-photo .ph-num{fill:var(--dan);stroke:var(--ink);stroke-width:1.5}
.pin-photo .ph-numt{font-size:10px;font-weight:700;text-anchor:middle;fill:var(--ink);font-family:var(--font-body)}
g.pin .pin-photo{display:none}
.map-svg.z-photo g.pin.has-photo .pin-photo{display:inline}
.map-svg.z-photo g.pin.has-photo .pin-std{display:none}
.map-svg.z-photo g.pin.has-photo .pin-lbl{transform:translate(12px,-16px)}
g.pin:hover .ph-ring, g.pin:focus .ph-ring{stroke-width:3.4}
g.pin path{fill:var(--pin,#E2785A);stroke:var(--ink);stroke-width:1.6;vector-effect:none}
g.pin circle{fill:#FFFDF8;stroke:none}
g.pin[data-kind="want"] path{fill:#E9E1D3;stroke-dasharray:3 2}
g.pin .pin-lbl{font-size:12.5px;font-family:var(--font-body);font-weight:500;paint-order:stroke;stroke:#FFFDF8;stroke-width:3.5px;fill:var(--ink);display:none;pointer-events:none}
.map-svg.z-pinlbl g.pin .pin-lbl{display:inline}
g.pin:hover path, g.pin:focus path{stroke-width:2.6}
g.pick path{fill:var(--dan);stroke:var(--ink);stroke-width:2;vector-effect:none}
g.pick circle{fill:var(--ink)}
.map-ctrl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.map-ctrl button{width:34px;height:34px;border:2px solid var(--ink);background:var(--card);border-radius:10px;cursor:pointer;font-size:18px;line-height:1;box-shadow:1.5px 2px 0 var(--ink)}
.map-ctrl .map-i{width:24px;height:24px;font-size:12px;font-family:Georgia,serif;font-style:italic;align-self:center;opacity:.55;box-shadow:none;border-width:1.5px}
.map-attr{position:absolute;right:10px;top:122px;max-width:240px;background:rgba(255,253,248,.95);border:1.5px solid var(--ink);border-radius:10px;padding:6px 10px;font-size:11.5px;color:var(--ink-2);z-index:5}
.map-views{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 70px)}
.map-views button{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:2px 12px;font-size:13px;cursor:pointer;box-shadow:1.5px 2px 0 var(--ink)}
.map-views button:hover{background:#FCEFC4}
.map-legend{position:absolute;left:10px;bottom:10px;display:flex;gap:10px;flex-wrap:wrap;background:rgba(255,253,248,.92);border:2px solid var(--ink);border-radius:10px;padding:3px 10px;font-size:12.5px}
.map-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);margin-right:4px;vertical-align:-1px}
.map-hint{position:absolute;right:10px;bottom:10px;font-size:12px;color:var(--ink-2);background:rgba(255,253,248,.85);border-radius:8px;padding:1px 8px}
.map-loading{display:grid;place-items:center;height:100%;color:var(--ink-2)}
.map-pop{position:absolute;z-index:5;transform:translate(-50%,-100%);margin-top:-30px;min-width:200px;max-width:270px;background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;box-shadow:2px 3px 0 var(--ink);font-size:14px}
.map-pop h4{margin:0 22px 2px 0;font-size:15px;line-height:1.35}
.map-pop .x{position:absolute;top:4px;right:6px;border:0;background:none;cursor:pointer;font-size:18px;line-height:1}
.map-pop .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ---------- modal ---------- */
#modals{position:relative;z-index:50}
.backdrop{position:fixed;inset:0;background:rgba(63,48,36,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow-y:auto}
.modal{width:100%;max-width:640px;background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--r);box-shadow:5px 6px 0 var(--ink);position:relative;margin-bottom:6vh}
.modal.wide{max-width:900px}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:2.5px dashed rgba(63,48,36,.35)}
.modal-head h2{font-size:24px;flex:1}
.modal-x{border:2px solid var(--ink);background:var(--card);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1;flex:none}
.modal-body{padding:18px 20px 22px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:0 20px 20px;flex-wrap:wrap}
.modal-foot .left{margin-right:auto}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field > label, .flabel{font-weight:700;font-size:14px}
.req{color:var(--canteen)}
.field input[type=text], .field input[type=date], .field input[type=number], .field input[type=url], .field textarea, .field select, .dual input, .dual textarea, .lp input{
  width:100%;padding:8px 12px;border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--card);
}
.field textarea, .dual textarea{resize:vertical;min-height:70px}
.hint{font-size:12.5px;color:var(--ink-2)}
.err{font-size:13px;color:#B23B2A}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1.2fr .8fr 1fr;gap:12px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:var(--r-sm);overflow:hidden;background:var(--card);width:fit-content;flex-wrap:wrap}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:5px 14px;border-right:2px solid var(--ink)}
.seg label:last-child span{border-right:0}
.seg input:checked + span{background:var(--dan)}
.seg input:focus-visible + span{outline:3px dashed var(--ink);outline-offset:-4px}
.suggest{display:flex;gap:6px;flex-wrap:wrap}
.suggest button{border:1.6px dashed var(--ink-2);background:transparent;border-radius:999px;padding:0 10px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.suggest button.on{border-style:solid;border-color:var(--ink);background:#FCEFC4;color:var(--ink)}
.dual{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dual-col{display:flex;flex-direction:column;gap:8px;padding:12px;border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--card)}
.dual-col.lu{background:#F7EADC} .dual-col.dan{background:#FFF8E4}
.dual-head{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:17px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;width:fit-content}
.check input{width:18px;height:18px;accent-color:var(--canteen)}
fieldset.box{border:2px dashed rgba(63,48,36,.35);border-radius:var(--r-sm);padding:12px 14px 14px;margin:0;display:flex;flex-direction:column;gap:10px}
fieldset.box legend{font-weight:700;font-size:14px;padding:0 6px}

/* photos field */
.photos{display:flex;gap:10px;flex-wrap:wrap}
.ph{position:relative;width:92px;height:92px;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--paper-2)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .rm, .ph .cover{position:absolute;top:3px;border:1.6px solid var(--ink);background:var(--card);border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:13px;line-height:1;display:grid;place-items:center;padding:0}
.ph .rm{right:3px} .ph .cover{left:3px}
.ph.first::after{content:"封面";position:absolute;left:0;right:0;bottom:0;background:rgba(63,48,36,.7);color:#fff;font-size:11px;text-align:center}
.ph.busy{display:grid;place-items:center;font-size:12px;color:var(--ink-2)}
.ph-add{width:92px;height:92px;border:2px dashed var(--ink);border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);font-size:13px;text-align:center;background:transparent}
.ph-add:hover{background:var(--card)}

/* location picker */
.lp{display:flex;flex-direction:column;gap:8px}
.lp-row{display:flex;gap:8px;align-items:center}
.lp-search{position:relative;flex:1}
.lp-results{position:absolute;left:0;right:0;top:100%;z-index:4;background:var(--card);border:2px solid var(--ink);border-radius:10px;margin-top:4px;max-height:260px;overflow:auto;box-shadow:2px 3px 0 var(--ink)}
.lp-results button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 12px;cursor:pointer;border-bottom:1px dashed rgba(63,48,36,.2)}
.lp-results button:hover, .lp-results button:focus{background:#FCEFC4}
.lp-status{font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;border-radius:10px;background:var(--paper-2)}
.lp-status.none{color:var(--ink-2)}

/* detail */
.detail-top{display:grid;grid-template-columns:220px 1fr;gap:22px}
.detail-top.noside{grid-template-columns:1fr}
.detail-poster{aspect-ratio:2/3;border:2.5px solid var(--ink);border-radius:var(--r-sm);overflow:hidden;position:relative;background:var(--cinema-soft);box-shadow:var(--shadow)}
.detail-poster img{width:100%;height:100%;object-fit:cover}
.detail-info{display:flex;flex-direction:column;gap:10px;min-width:0}
.detail-info h3{font-size:30px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.say{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.say-col{display:flex;flex-direction:column;gap:8px}
.say-head{display:flex;align-items:center;gap:8px}
.say-head .nm{font-family:var(--font-display);font-size:18px}
.say-bubble{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:8px 12px;position:relative;font-size:15px}
.say-col.lu .say-bubble{background:#F7EADC}
.say-col.dan .say-bubble{background:#FFF8E4}
.say-long{font-size:14.5px;color:var(--ink);white-space:normal;padding:2px 4px}
.prose{max-width:65ch}
.gallery-main{aspect-ratio:4/3;border:2.5px solid var(--ink);border-radius:var(--r-sm);overflow:hidden;background:var(--paper-2);cursor:zoom-in}
.gallery-main img{width:100%;height:100%;object-fit:cover}
.gallery-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.gallery-thumbs button{width:64px;height:64px;padding:0;border:2px solid var(--ink);border-radius:10px;overflow:hidden;cursor:pointer;background:none}
.gallery-thumbs button[aria-current="true"]{outline:3px solid var(--dan);outline-offset:1px}
.gallery-thumbs img{width:100%;height:100%;object-fit:cover}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.photo-grid button{padding:0;border:2px solid var(--ink);border-radius:12px;overflow:hidden;aspect-ratio:1;cursor:zoom-in;background:none}
.photo-grid img{width:100%;height:100%;object-fit:cover}
.place-list{display:flex;flex-direction:column;gap:8px}
.place-item{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--card)}
.place-item .pn{font-weight:700}
.place-item .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pi-main{min-width:0;flex:1}
.place-photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.place-photos > *{width:58px;height:58px;padding:0;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--paper-2);cursor:zoom-in;display:grid;place-items:center;font-size:13px}
.place-photos img{width:100%;height:100%;object-fit:cover}
.pop-strip{display:flex;gap:4px;margin:0 22px 6px 0;align-items:center}
.pop-strip button{width:52px;height:52px;padding:0;border:1.6px solid var(--ink);border-radius:8px;overflow:hidden;cursor:zoom-in;background:var(--paper-2)}
.pop-strip img{width:100%;height:100%;object-fit:cover}
.pop-strip .more{font-size:12px;color:var(--ink-2)}
.trip-cover{position:relative}
.trip-cover .count{position:absolute;right:8px;bottom:8px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:0 8px;font-size:12px}
.place-num{width:24px;height:24px;border-radius:50%;background:var(--travel);color:#fff;display:grid;place-items:center;font-size:13px;flex:none;margin-top:2px;border:1.6px solid var(--ink)}
.subhead{font-family:var(--font-display);font-size:19px;margin:18px 0 8px}
.loc-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(30,22,16,.92);display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:92vw;max-height:86vh;border-radius:10px;border:3px solid #FFFDF8}
.lightbox button{position:absolute;border:2px solid #FFFDF8;background:rgba(0,0,0,.3);color:#FFFDF8;border-radius:50%;width:44px;height:44px;font-size:22px;cursor:pointer}
.lightbox .lx{top:16px;right:16px} .lightbox .lp-prev{left:16px;top:50%} .lightbox .lp-next{right:16px;top:50%}
.lightbox .lc{position:absolute;bottom:14px;color:#FFFDF8;font-family:var(--font-hand);font-size:18px}

/* random picker */
.roulette{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0;text-align:center}
.roulette .slot{font-family:var(--font-display);font-size:32px;min-height:52px;padding:6px 22px;border:2.5px solid var(--ink);border-radius:var(--r-sm);background:var(--card);box-shadow:var(--shadow);min-width:240px}

/* toast */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#FFFDF8;padding:8px 18px;border-radius:999px;font-size:14px;box-shadow:2px 3px 0 rgba(0,0,0,.2);animation:pop .2s ease-out}
.toast.err{background:#B23B2A}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

footer{max-width:1180px;margin:0 auto;padding:20px 20px 40px;color:var(--ink-2);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;border-top:2px dashed rgba(63,48,36,.25)}
footer .fbtns{margin-left:auto;display:flex;gap:8px}

.settings-av{display:flex;gap:18px;flex-wrap:wrap}
.settings-av .one{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 14px;border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--card)}
.avatar-img{object-fit:contain;flex:none}
.avatar-img.photo{border-radius:28%;background:#FFFDF8;border:2px solid var(--ink);padding:1px;object-fit:cover}
.avatar-img.cut{border:0;background:transparent;border-radius:0;padding:0;filter:drop-shadow(1px 2px 0 rgba(63,48,36,.25))}
.checker{background:conic-gradient(#EFE6D6 25%, #FFFDF8 0 50%, #EFE6D6 0 75%, #FFFDF8 0) 0 0/18px 18px}
.cut-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cut-box{display:flex;flex-direction:column;gap:6px;align-items:center}
.cut-box canvas, .cut-box img{width:100%;max-width:300px;aspect-ratio:1;object-fit:contain;border:2px solid var(--ink);border-radius:var(--r-sm)}
.cut-ctrl{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.cut-ctrl input[type=range]{width:100%;accent-color:var(--lu)}
.settings-av .one .btns{display:flex;flex-direction:column;gap:6px;align-items:stretch}
body.can-edit .settings-av .btns.edit-only{display:flex !important}
.hero-edit{position:absolute;right:12px;bottom:10px;border:0;background:none;cursor:pointer;font-size:15px;color:var(--ink-3);opacity:.45;padding:4px 6px;border-radius:8px;z-index:2}
.hero-edit:hover, .hero-edit:focus-visible{opacity:1;background:var(--paper-2)}
@media (max-width:760px){ .cut-wrap{grid-template-columns:1fr} }
.export-box{width:100%;height:180px;font-family:monospace;font-size:12px}

@media (max-width:1000px){ .nav a{padding:6px 9px;font-size:16px} .brand-name{font-size:21px} }
@media (max-width:760px){
  .topbar-in{padding:8px 14px}
  .brand-name{font-size:20px}
  .nav{display:none}
  .gear{margin-left:auto}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:2.5px solid var(--ink);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;text-decoration:none;font-family:var(--font-display);font-size:13px;padding:2px 0;border-radius:12px}
  .bottom-nav a[aria-current="page"]{background:#FCEFC4}
  main{padding:16px 14px 110px}
  footer{padding-bottom:110px}
  .hero{grid-template-columns:1fr;padding:20px}
  .hero h1{font-size:32px}
  .hero-art{min-height:170px}
  .district-head h1{font-size:28px}
  .district-head .head-actions{margin-left:0;width:100%}
  .poster-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px}
  .row2,.row3,.dual,.say{grid-template-columns:1fr}
  .inv-list, .inv-summary{grid-template-columns:1fr}
  .tx-row{grid-template-columns:1fr 1fr;padding:8px;border:2px dashed rgba(63,48,36,.25);border-radius:12px}
  .tx-row .tx-note{grid-column:1 / -1}
  .tx-row[data-kind="buy"] .tx-amount, .tx-row[data-kind="sell"] .tx-amount, .tx-row[data-kind="div"] .tx-qty, .tx-row[data-kind="div"] .tx-price, .tx-row[data-kind="div"] .tx-fee, .tx-row[data-kind="fee"] .tx-qty, .tx-row[data-kind="fee"] .tx-price, .tx-row[data-kind="fee"] .tx-fee{display:none}
  .bottom-nav a{font-size:12px}
  input, select, textarea{font-size:16px !important}
  .detail-top{grid-template-columns:1fr}
  .detail-poster{max-width:200px}
  .modal-body{padding:14px}
  .backdrop{padding:2vh 8px}
  #toasts{bottom:92px}
  .travel-stats{display:flex;flex-wrap:wrap;gap:6px}
  .tstat{padding:2px 10px;font-size:12.5px;border-width:1.6px}
  .tstat b{font-size:19px}
  .map-views button{padding:1px 9px;font-size:12px}
}

/* Google Maps version */
.geomap.gmap .gmap-box{position:absolute;inset:0}
.geomap.gmap .map-legend{bottom:30px}
.gpins{position:absolute;left:0;top:0}
.gpin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;outline:none;line-height:0}
.gpin.pick{cursor:default}
.gpin .gp-std{display:block;filter:drop-shadow(1px 2px 0 rgba(63,48,36,.25))}
.gpin.want .gp-std path{stroke-dasharray:3 2}
.gpin:hover .gp-std path, .gpin:focus .gp-std path{stroke-width:2.6}
.gpin .gp-photo{display:none;position:relative;width:44px;height:44px;margin-bottom:9px;border-radius:50%;border:2.5px solid var(--ink);background:#FFFDF8;box-shadow:2px 3px 0 rgba(63,48,36,.35)}
.gpin .gp-photo img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.gpin .gp-photo::after{content:"";position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);border:6px solid transparent;border-top:9px solid var(--ink)}
.gpin .gp-photo b{position:absolute;right:-7px;top:-7px;width:19px;height:19px;border-radius:50%;background:var(--dan);border:1.6px solid var(--ink);font:700 10px/16px var(--font-body);text-align:center}
.geomap.z-photo .gpin.has-photo .gp-std{display:none}
.geomap.z-photo .gpin.has-photo .gp-photo{display:block}
.gpin:hover .gp-photo, .gpin:focus .gp-photo{border-width:3.5px}
.gpin .gp-lbl{display:none;position:absolute;left:calc(100% + 3px);top:6px;white-space:nowrap;font:500 12.5px/1.6 var(--font-body);color:var(--ink);background:rgba(255,253,248,.92);border-radius:6px;padding:0 6px;pointer-events:none}
.geomap.z-pinlbl .gpin .gp-lbl{display:block}
.gpop{font-family:var(--font-body);color:var(--ink);font-size:14px;line-height:1.55;max-width:250px}
.gpop h4{margin:0 0 2px;font-size:15px}
.gpop .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.gpop .pop-strip{margin-right:0}
@media (prefers-reduced-motion:reduce){

/* ---------- state ---------- */

/* ---------- toasts, modals, confirm ---------- */
function toast(msg, type = '') {
  const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), type === 'err' ? 5200 : 2600);
}
const modalStack = [];
function openModal({ title = '', body = '', foot = '', wide = false, guard = null, onClose = null }) {
  const bd = document.createElement('div'); bd.className = 'backdrop';
  bd.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><h2>${title}</h2><button class="modal-x" type="button" aria-label="关闭">×</button></div>
    <div class="modal-body">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div>`;
  $('#modals').appendChild(bd);

    if (!force && m.guard && !(await m.guard())) return false;
    const i = modalStack.indexOf(m); if (i >= 0) modalStack.splice(i, 1);
    bd.remove(); if (!modalStack.length) document.body.classList.remove('modal-open');
    m.onClose?.(); try { m.prevFocus?.focus?.(); } catch {}
    return true;
  };

  bd.addEventListener('mousedown', e => { if (e.target === bd && !m.guard) m.close(); });
  modalStack.push(m);

  const isForm = !!$('form, .form', m.box);
  setTimeout(() => { const f = (!coarse && isForm && $('input[type=text],textarea', m.box)) || $('.modal-x', bd); f?.focus({ preventScroll: true }); }, 30);
  return m;
}
document.addEventListener('keydown', e => {

  }

function reopen(fn) { setTimeout(fn, 250); }

  return new Promise(res => {
    const m = openModal({ title: '确认一下', body: `<p style="margin:0">${esc(msg)}</p>`,
      foot: `<button class="btn" type="button" data-r="0">取消</button><button class="btn ${danger ? 'danger' : 'primary'}" type="button" data-r="1">${esc(ok)}</button>` });

    m.onClose = () => { if (!done) res(false); };

  });

function formGuard(root, initial) {
  return async () => {
    if (serializeForm(root) === initial) return true;

  };
}

  return $$('input,textarea,select', root).map(i => i.type === 'radio' || i.type === 'checkbox' ? i.checked : i.value).join('\u0001') + '|' + $$('.star-input', root).map(s => s.dataset.value).join(',') + '|' + $$('.photos', root).map(p => p.dataset.ids || '').join(',') + '|' + ($('[data-places]', root)?.dataset.places || '');
}

/* ---------- lightbox ---------- */
function openLightbox(ids, i = 0) {
  if (!ids?.length) return;
  const lb = document.createElement('div'); lb.className = 'lightbox';
  const show = () => { lb.innerHTML = `<img src="${esc(imgUrl(ids[i]))}" alt="照片 ${i + 1}"><button class="lx" aria-label="关闭">×</button>${ids.length > 1 ? `<button class="lp-prev" aria-label="上一张">‹</button><button class="lp-next" aria-label="下一张">›</button><div class="lc">${i + 1} / ${ids.length}</div>` : ''}`; };
  show();
  lb.addEventListener('click', e => {
    if (e.target.closest('.lp-prev')) { i = (i - 1 + ids.length) % ids.length; show(); }
    else if (e.target.closest('.lp-next')) { i = (i + 1) % ids.length; show(); }
    else if (e.target.tagName !== 'IMG') lb.remove();

  document.addEventListener('keydown', function k(e) { if (!lb.isConnected) return document.removeEventListener('keydown', k); if (e.key === 'ArrowRight') { i = (i + 1) % ids.length; show(); } if (e.key === 'ArrowLeft') { i = (i - 1 + ids.length) % ids.length; show(); } });

/* ---------- backend ---------- */
async function getClaude() {

      S[col] = snap.docs.map(d => ({ ...d.data(), id: d.id }));

      done(); scheduleRefresh();
    }, err => { console.warn(col, err); S.ready[col] = true; done(); scheduleRefresh(); });

async function compressImage(file) {
  if (!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type) && file.type !== '') return file;
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const max = 1800, r = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * r); c.height = Math.round(bmp.height * r);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(b => res(b), 'image/jpeg', 0.85));
    return blob && blob.size < file.size * 1.2 ? blob : file;
  } catch { return file; }
}

    const r = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * r); c.height = Math.round(bmp.height * r);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);

  } catch { return null; }
}

  const opts = blob.type ? undefined : { type: 'image/jpeg' };
  const r = await S.assets.upload(blob, opts);
  S.localUrls[r.id] = r.url;
  let ref = r.id;
  const tb = await makeThumb(file);
  if (tb && tb.size < blob.size * 0.8) {
    try { const t = await S.assets.upload(tb); S.localUrls[t.id] = t.url; ref = r.id + '|' + t.id; } catch {}
  }
  return ref;
}
function uploadErrorText(e, file) {
  const c = e?.code;
  if (c === 'unsupported_type') return `「${file.name}」的格式传不上去（比如 HEIC），请先转成 JPG 再试。`;
  if (c === 'too_large') return `「${file.name}」太大了（超过 20MB）。`;
  if (c === 'quota_or_state') return '照片存储空间满了，删掉一些不用的照片再试。';
  if (c === 'rate_limited') return '传得太快啦，等几秒再试。';
  return `「${file.name}」上传失败，再试一次。`;
}
// A photo strip field: returns controller {get(), uploadedNow, busy()}
function mountPhotoField(container, ids = [], { max = 30, label = '添加照片' } = {}) {
  const st = { ids: [...ids], busy: 0, uploadedNow: new Set() };
  const inputId = 'pf-' + Math.random().toString(36).slice(2, 8);
  const draw = () => {
    container.dataset.ids = st.ids.join(',');
    if (!S.assets) {
      container.innerHTML = (st.ids.map((id, i) => `<div class="ph ${i === 0 && max > 1 ? 'first' : ''}">${imgTag(id)}</div>`).join('')) + `<div class="hint">登录以后才能上传照片${S.backend !== 'ok' ? '（现在没连上数据库）' : ''}。</div>`;
      return;
    }
    container.innerHTML = st.ids.map((id, i) => `<div class="ph ${i === 0 && max > 1 ? 'first' : ''}" data-id="${esc(id)}">${imgTag(id)}
        ${max > 1 && i > 0 ? `<button type="button" class="cover" title="设为封面" aria-label="设为封面">★</button>` : ''}
        <button type="button" class="rm" title="移除" aria-label="移除这张照片">×</button></div>`).join('')
      + Array.from({ length: st.busy }, () => `<div class="ph busy">上传中…</div>`).join('')
      + (st.ids.length + st.busy < max ? `<label class="ph-add" for="${inputId}">＋<br>${label}</label><input id="${inputId}" class="visually-hidden" type="file" accept="image/*" ${max > 1 ? 'multiple' : ''}>` : '');
  };

    get: () => [...st.ids], busy: () => st.busy > 0,
    // assets uploaded in this form but not kept → delete; original assets removed → delete
    async cleanup(saved, original = []) {
      const keep = new Set(saved ? st.ids : original);

  };
}

/* where is a point? → "Queenstown · 新加坡" / "京都府 · 日本" */
async function describePoint(lng, lat) {
  try {
    const [world, detail, sg, prov] = await Promise.all([loadGeo('world'), loadGeo('detail'), loadGeo('sg'), loadGeo('provinces').catch(() => null)]);
    const pt = [lng, lat];
    const sgc = sg.features.find(f => f.properties.k === 'country');
    if (lng > 103.5 && lng < 104.2 && lat > 1.1 && lat < 1.55) {
      const pa = sg.features.find(f => f.properties.k === 'pa' && d3.geoContains(f, pt));
      if (pa || d3.geoContains(sgc, pt)) return { area: pa ? `${pa.properties.n} · 新加坡` : '新加坡', country: '新加坡' };
    }
    const quick = f => { const [[w, s], [e, n]] = d3.geoBounds(f); return lng >= w && lng <= e && lat >= s && lat <= n; };
    const c = [...detail.features, ...world.features].find(f => quick(f) && d3.geoContains(f, pt));
    const country = c?.properties.n || '';
    const p = prov?.features.find(f => quick(f) && d3.geoContains(f, pt));
    return { area: [p?.properties.n, country].filter(Boolean).join(' · '), country };
  } catch { return { area: '', country: '' }; }
}

/* parse a Google Maps link or typed coordinates */
function parseLocText(text) {
  const t = String(text || '').trim(); if (!t) return null;
  const out = { gmaps: /^https?:\/\//i.test(t) ? t : '' };
  let m = t.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/) || t.match(/[?&](?:q|query|ll|destination|center|daddr)=(?:loc:)?(-?\d+(?:\.\d+)?)(?:,|%2C)\s*\+?(-?\d+(?:\.\d+)?)/i) || t.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/) || t.match(/^\(?\s*(-?\d+(?:\.\d+)?)\s*[,，\s]\s*(-?\d+(?:\.\d+)?)\s*\)?$/);
  if (m) { out.lat = +m[1]; out.lng = +m[2]; }
  else {
    const d = t.match(/(\d+(?:\.\d+)?)°\s*(\d+(?:\.\d+)?)['′]\s*(\d+(?:\.\d+)?)["″]?\s*([NS])[\s,]+(\d+(?:\.\d+)?)°\s*(\d+(?:\.\d+)?)['′]\s*(\d+(?:\.\d+)?)["″]?\s*([EW])/i);
    if (d) { out.lat = (+d[1] + d[2] / 60 + d[3] / 3600) * (/s/i.test(d[4]) ? -1 : 1); out.lng = (+d[5] + d[6] / 60 + d[7] / 3600) * (/w/i.test(d[8]) ? -1 : 1); }
  }
  const pn = t.match(/\/maps\/place\/([^/@?]+)/);
  if (pn) { try { out.name = decodeURIComponent(pn[1].replace(/\+/g, ' ')); } catch {} }
  if (out.lat != null && (Math.abs(out.lat) > 90 || Math.abs(out.lng) > 180)) { delete out.lat; delete out.lng; }
  if (out.lat == null && !out.gmaps) return null;
  return out;
}

/* gazetteer search (Natural Earth populated places + Singapore planning areas) */
let SG_PLACES = null;
async function searchPlaces(q) {
  q = q.trim().toLowerCase(); if (!q) return [];
  const rows = await loadGeo('places');
  if (!SG_PLACES) { const sg = await loadGeo('sg'); SG_PLACES = sg.features.filter(f => f.properties.k === 'pa').map(f => { const [lng, lat] = d3.geoCentroid(f); return [f.properties.n, f.properties.n, '新加坡', +lat.toFixed(4), +lng.toFixed(4), '']; }); }
  const res = [];
  for (const r of [...SG_PLACES, ...rows]) {
    const names = [r[0], r[1], r[5] || ''].map(x => x.toLowerCase());
    let score = 9;
    if (names.some(n => n === q)) score = 0; else if (names.some(n => n.startsWith(q))) score = 1; else if (names.some(n => n.includes(q))) score = 2;
    if (score < 9) { res.push([score, res.length, r]); if (res.length >= 60) break; }
  }
  return res.sort((a, b) => a[0] - b[0] || a[1] - b[1]).slice(0, 10).map(x => x[2]);
}

async function claudeLocate(query, hint) { return window.google?.maps?.importLibrary ? googleLocate(query, hint) : window.LBD_LOCATE(query); }

    try { await saveMeta({ headline: val(md.el, '#he-head'), motto: val(md.el, '#he-motto'), bubble: val(md.el, '#he-bubble') }); md.close(true); toast('城门换好了'); refresh(); }
    catch (err) { handleWriteError(err); }
  });
}

/* ---------- avatar cutout: remove the plain background around a character ---------- */
async function loadBitmap(blob, max = 900) {
  const bmp = await createImageBitmap(blob, { imageOrientation: 'from-image' });
  const r = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * r); c.height = Math.round(bmp.height * r);
  const ctx = c.getContext('2d', { willReadFrequently: true }); ctx.drawImage(bmp, 0, 0, c.width, c.height);
  return ctx.getImageData(0, 0, c.width, c.height);
}
function cutout(img, tol, keepLargest) {
  const { width: w, height: h, data: src } = img, N = w * h;
  // background colour = the most common colour along the border
  const buckets = new Map();
  const border = [];
  for (let x = 0; x < w; x++) border.push(x, (h - 1) * w + x);
  for (let y = 1; y < h - 1; y++) border.push(y * w, y * w + w - 1);
  for (const i of border) { const p = i * 4; if (src[p + 3] < 20) continue; const k = (src[p] >> 4) << 8 | (src[p + 1] >> 4) << 4 | (src[p + 2] >> 4); const b = buckets.get(k) || [0, 0, 0, 0]; b[0] += src[p]; b[1] += src[p + 1]; b[2] += src[p + 2]; b[3]++; buckets.set(k, b); }
  let best = [255, 255, 255, 1]; for (const b of buckets.values()) if (b[3] > best[3]) best = b;
  const bg = [best[0] / best[3], best[1] / best[3], best[2] / best[3]];
  const dist = i => { const p = i * 4; return Math.hypot(src[p] - bg[0], src[p + 1] - bg[1], src[p + 2] - bg[2]); };
  const isBg = new Uint8Array(N), stack = [];
  const test = i => src[i * 4 + 3] < 20 || dist(i) < tol;
  for (const i of border) if (!isBg[i] && test(i)) { isBg[i] = 1; stack.push(i); }
  while (stack.length) {
    const i = stack.pop(), x = i % w;
    for (const n of [x > 0 ? i - 1 : -1, x < w - 1 ? i + 1 : -1, i - w, i + w]) if (n >= 0 && n < N && !isBg[n] && test(n)) { isBg[n] = 1; stack.push(n); }
  }
  if (keepLargest) {
    const lab = new Int32Array(N); let bestL = 0, bestN = 0, L = 0;
    for (let s0 = 0; s0 < N; s0++) {
      if (isBg[s0] || lab[s0]) continue;
      L++; let cnt = 0; const st = [s0]; lab[s0] = L;
      while (st.length) { const i = st.pop(), x = i % w; cnt++; for (const n of [x > 0 ? i - 1 : -1, x < w - 1 ? i + 1 : -1, i - w, i + w]) if (n >= 0 && n < N && !isBg[n] && !lab[n]) { lab[n] = L; st.push(n); } }
      if (cnt > bestN) { bestN = cnt; bestL = L; }
    }
    for (let i = 0; i < N; i++) if (!isBg[i] && lab[i] !== bestL) isBg[i] = 1;
  }
  const out = new ImageData(new Uint8ClampedArray(src), w, h), o = out.data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let i = 0; i < N; i++) {
    const x = i % w, y = (i / w) | 0;
    if (isBg[i]) { o[i * 4 + 3] = 0; continue; }
    // soften the edge: pixels touching the background that are still close to its colour fade out a little
    const edge = (x > 0 && isBg[i - 1]) || (x < w - 1 && isBg[i + 1]) || (i >= w && isBg[i - w]) || (i + w < N && isBg[i + w]);
    if (edge) { const d = dist(i); if (d < tol * 1.8) o[i * 4 + 3] = Math.round(o[i * 4 + 3] * Math.max(0.35, Math.min(1, (d - tol) / (tol * 0.8) + 0.35))); }
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  if (x1 < 0) return null;
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1, side = Math.round(Math.max(bw, bh) * 1.06);
  const tmp = document.createElement('canvas'); tmp.width = w; tmp.height = h; tmp.getContext('2d').putImageData(out, 0, 0);
  const c = document.createElement('canvas'); c.width = side; c.height = side;
  c.getContext('2d').drawImage(tmp, x0, y0, bw, bh, Math.round((side - bw) / 2), Math.round((side - bh) / 2), bw, bh);
  return c;
}
function openCutout(blob, who) {
  const md = openModal({
    title: `${WHO[who]}的新头像`, wide: true,
    body: `<div class="cut-wrap"><div class="cut-box"><span class="muted tiny">原图</span><img id="cut-orig" alt="原图"></div>
        <div class="cut-box"><span class="muted tiny">去掉背景以后</span><canvas id="cut-cv" class="checker" width="300" height="300"></canvas></div></div>
      <div class="cut-ctrl">
        <label class="check"><input type="checkbox" id="cut-on" checked> 去掉背景色块，只保留形象</label>
        <div class="field cut-opt"><label for="cut-tol">去背景的力度 <span class="muted tiny" id="cut-tv"></span></label><input type="range" id="cut-tol" min="4" max="90" value="28"><div class="hint">形象被吃掉了就往左拉；背景还有残留就往右拉。适合背景是纯色或接近纯色的图。</div></div>
        <label class="check cut-opt"><input type="checkbox" id="cut-big" checked> 只保留最大的一块（去掉旁边零散的小装饰）</label>
      </div>`,
    foot: `<button class="btn" type="button" data-x="cancel">取消</button><button class="btn primary" type="button" data-x="ok">用这张</button>`,
  });
  const root = md.el, cv = $('#cut-cv', root);
  const url = URL.createObjectURL(blob); $('#cut-orig', root).src = url;
  let img = null, result = null, timer;
  const draw = () => {
    const on = $('#cut-on', root).checked; $$('.cut-opt', root).forEach(x => x.hidden = !on);
    $('#cut-tv', root).textContent = $('#cut-tol', root).value;
    if (!img) return;
    if (on) result = cutout(img, +$('#cut-tol', root).value, $('#cut-big', root).checked);
    else { result = document.createElement('canvas'); result.width = img.width; result.height = img.height; result.getContext('2d').putImageData(img, 0, 0); }
    const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, 300, 300);
    if (!result) { ctx.font = '14px sans-serif'; ctx.fillStyle = '#7A6552'; ctx.fillText('全被去掉了，往左拉一点', 60, 150); return; }
    const r = Math.min(300 / result.width, 300 / result.height), dw = result.width * r, dh = result.height * r;
    ctx.drawImage(result, (300 - dw) / 2, (300 - dh) / 2, dw, dh);
  };
  root.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(draw, 60); });
  loadBitmap(blob).then(d => { img = d; draw(); }).catch(() => { toast('这张图打不开，换一张试试（HEIC 请先转成 JPG/PNG）', 'err'); md.close(true); });
  md.onClose = () => URL.revokeObjectURL(url);
  root.addEventListener('click', async e => {
    const x = e.target.closest('[data-x]')?.dataset.x; if (!x) return;
    if (x === 'cancel') return md.close(true);
    if (!result) return toast('还没处理好，或者形象全被去掉了', 'err');
    const btn = e.target.closest('button'); btn.disabled = true; btn.textContent = '上传中…';
    try {
      const cut = $('#cut-on', root).checked;
      const png = await new Promise(res => result.toBlob(res, cut ? 'image/png' : 'image/jpeg', 0.9));
      const ref = await uploadPhoto(new File([png], cut ? 'avatar.png' : 'avatar.jpg', { type: png.type }));
      const old = S.meta?.['avatar_' + who];
      await saveMeta({ ['avatar_' + who]: ref, ['avatar_' + who + '_style']: cut ? 'cut' : 'photo' });
      if (old && old !== ref) await deleteRefs([old]);
      md.close(true); toast('头像换好了'); refresh(); modalStack.find(m => m.isSettings)?.close(true); openSettings();
    } catch (err) { btn.disabled = false; btn.textContent = '用这张'; if (err?.code) handleWriteError(err); else toast('上传失败，再试一次', 'err'); }
  });
}

/* ---------- settings & export ---------- */
function openSettings() {
  const md = openModal({
    title: '城市设置',
    body: `<div class="form">
      ${window.LBD_AUTH ? LBD_AUTH.html() : ''}
      <div class="field"><label for="st-since">在一起的日子</label><input id="st-since" type="date" value="${esc(S.meta?.since || '')}"><div class="hint">首页会显示「噜和蛋在一起的第几天」。</div></div>
      <div class="field edit-only"><span class="flabel">城门上的字</span><div><button class="btn small edit-only" type="button" data-act="edit-hero">✎ 改大标题、标语和气泡</button></div></div>
      <div class="field"><span class="flabel">头像</span><div class="settings-av">${['lu', 'dan'].map(w => `<div class="one">${avatar(w, 72)}<span>${WHO[w]}</span>
        <div class="btns edit-only">${S.assets ? `<label class="btn small" for="st-up-${w}">上传新头像</label><input id="st-up-${w}" class="visually-hidden" type="file" accept="image/*" data-who="${w}">` : ''}
          ${S.meta?.['avatar_' + w] && S.assets ? `<button class="btn small" type="button" data-recut="${w}">给现在的头像去背景</button>` : ''}
          ${S.meta?.['avatar_' + w] ? `<button class="btn small ghost" type="button" data-reset="${w}">换回默认画像</button>` : ''}</div></div>`).join('')}</div>
        <div class="hint">上传后会自动去掉图片四周的纯色背景，只留下形象，还能调整力度。</div></div>
      <div class="field"><span class="flabel">数据</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" type="button" data-act="export">导出完整备份（记录 + 照片，.zip）</button>${window.LBD_AUTH ? LBD_AUTH.importHtml() : ''}</div><div class="hint" id="st-usage"></div></div>
    </div>`,
    foot: `<button class="btn" type="button" data-x="cancel">关闭</button><button class="btn primary edit-only" type="button" data-x="save">保存</button>`,
  });
  const root = md.el; md.isSettings = true;
  if (!canEdit()) $$('input:not(#lbd-pass)', root).forEach(i => i.disabled = true);
  root.addEventListener('change', e => { const f = e.target.files?.[0]; if (f && e.target.dataset.who) { openCutout(f, e.target.dataset.who); e.target.value = ''; } });
  S.assets?.list?.().then(r => { const u = r.usage; if (u) $('#st-usage', root).textContent = `照片存储：已用 ${(u.bytes / 1048576).toFixed(1)} MB / ${(u.maxBytes / 1048576).toFixed(0)} MB，共 ${u.files} 个文件。`; }).catch(() => {});
  root.addEventListener('click', async e => {
    const rc = e.target.closest('[data-recut]');
    if (rc) {
      const w = rc.dataset.recut; rc.disabled = true;
      try { const r = await fetch(imgUrl(S.meta['avatar_' + w])); if (!r.ok) throw 0; openCutout(await r.blob(), w); } catch { toast('现在的头像读不出来，重新上传一次吧', 'err'); }
      rc.disabled = false; return;
    }
    const r = e.target.closest('[data-reset]');
    if (r) {
      const w = r.dataset.reset; if (!(await confirmDialog(`把${WHO[w]}换回默认画像？`, { ok: '换回默认' }))) return;
      const old = S.meta['avatar_' + w];
      try { await saveMeta({ ['avatar_' + w]: null, ['avatar_' + w + '_style']: null }); await deleteRefs([old]); toast('换回默认了'); refresh(); md.close(true); openSettings(); } catch (err) { handleWriteError(err); }
      return;
    }
    const x = e.target.closest('[data-x]')?.dataset.x; if (!x) return;
    if (x === 'cancel') return md.close(true);
    try { await saveMeta({ since: val(root, '#st-since') }); md.close(true); toast('保存好了'); refresh(); }
    catch (err) { handleWriteError(err); }
  });
}
function loadScript(src) { return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); }); }
function allPhotoIds() {
  const ids = new Set();
  const add = r => refIds(r).forEach(i => ids.add(i));
  for (const m of S.movies) if (m.poster) add(m.poster);
  for (const m of S.meals) (m.photos || []).forEach(add);
  for (const t of S.trips) tripRefs(t).forEach(add);
  for (const w of ['lu', 'dan']) if (S.meta?.['avatar_' + w]) add(S.meta['avatar_' + w]);
  return [...ids];
}
// full backup: data.json + every photo, as one zip (used to move the city to its own website)
async function exportAll() {
  const md = openModal({ title: '导出完整备份', body: `<p style="margin-top:0">会把所有记录和照片打包成一个 .zip 文件，可以用来备份，或者搬到独立网站。</p><div class="hint" id="ex-st">准备中…</div>` });
  const st = $('#ex-st', md.el);
  try {
    if (typeof JSZip === 'undefined') await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    const zip = new JSZip();
    const ids = allPhotoIds(), photoTypes = {};
    let n = 0, failed = 0;
    for (const id of ids) {
      st.textContent = `正在打包照片 ${++n} / ${ids.length}…`;
      try { const r = await fetch(imgUrl(id)); if (!r.ok) throw 0; const b = await r.blob(); photoTypes[id] = b.type || 'image/jpeg'; zip.file('photos/' + id, b); } catch { failed++; }
    }
    const data = { app: '噜包蛋之城', format: 2, exportedAt: new Date().toISOString(), meta: S.meta, movies: S.movies, meals: S.meals, trips: S.trips, invest: S.invest, photoTypes };
    zip.file('data.json', JSON.stringify(data, null, 2));
    st.textContent = '正在压缩…';
    const blob = await zip.generateAsync({ type: 'blob' });
    const fname = `luuegg-backup-${todayStr()}.zip`;
    st.textContent = `打包好了：${S.movies.length} 部电影、${S.meals.length} 顿饭、${S.trips.length} 次旅行、${S.invest.length} 个投资、${ids.length - failed} 张照片${failed ? `（${failed} 张没读到）` : ''}。`;
    if (S.downloads) { try { await S.downloads.save({ filename: fname, data: blob }); toast('导出好了'); } catch (e) { if (e?.code !== 'declined') toast('下载没成功，再点一次试试', 'err'); } }
    else toast('这里没法下载文件', 'err');
  } catch (e) { console.error(e); st.textContent = '打包失败了，刷新页面再试一次。'; }
}

/* ---------- global actions ---------- */
document.addEventListener('click', async e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  const needEdit = act.startsWith('new-');
  if (needEdit && !canEdit()) { toast(S.backend === 'ok' ? '你现在只能看，不能添加。' : '还没连上数据库，没法保存。', 'err'); return; }
  switch (act) {
    case 'settings': openSettings(); break;
    case 'edit-hero': if (!canEdit()) return toast('你现在只能看，不能修改。', 'err'); openHeroEditor(); break;
    case 'export': exportAll(); break;
    case 'new-movie': movieForm(null, { status: a.dataset.status }); break;
    case 'new-meal': mealForm(null, { status: a.dataset.status }); break;
    case 'new-trip': tripForm(null, { status: a.dataset.status }); break;
    case 'new-inv': investForm(); break;
    case 'open-inv': openInvest(id); break;
    case 'open-movie': openMovie(id); break;
    case 'open-meal': if (modalStack.length && a.closest('.roulette')) await modalStack[modalStack.length - 1].close(true); openMeal(id); break;
    case 'open-trip': openTrip(id); break;
    case 'roulette': openRoulette(); break;
    case 'lb': openLightbox(LB.get(a.dataset.k) || [], +a.dataset.i || 0); break;
  }
});

(window.LBD_READY || Promise.resolve()).then(() => { refresh(); initBackend(); });
